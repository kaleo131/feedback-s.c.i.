<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guia de Feedback - Ciclo de Performance</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #fafbf6; /* Cor de fundo solicitada */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Classe para ocultar a barra de rolagem da paginação */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (max-width: 640px) {
            .hide-on-mobile { display: none; }
        }

        /* Efeito cursor de texto digitando */
        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-start infinite;
            color: #10b981; /* Ajustado para emerald-500 combinando com o tema */
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="antialiased text-slate-800 flex flex-col">

    <!-- OVERLAY DE INÍCIO DA APRESENTAÇÃO -->
    <div id="start-overlay" class="fixed inset-0 z-[100] bg-white/80 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl flex flex-col items-center max-w-lg w-11/12 text-center border border-slate-200 transform transition-transform">
            
            <!-- Ícone de Play Animado -->
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-6 animate-bounce">
                <i data-lucide="play" class="w-10 h-10 ml-1"></i>
            </div>
            
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-3">Guia de Feedback</h1>
            <p class="text-slate-500 mb-8">Bem-vindo(a) ao guia interativo de Feedback. Escolha como deseja iniciar a apresentação.</p>
            
            <!-- Botões de Escolha de Áudio -->
            <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                <button onclick="startPresentation(true)" class="px-6 py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full font-bold text-base transition-transform hover:scale-105 active:scale-95 shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 w-full sm:flex-1">
                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                    Com Áudio
                </button>
                <button onclick="startPresentation(false)" class="px-6 py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-full font-bold text-base transition-transform hover:scale-105 active:scale-95 shadow-sm flex items-center justify-center gap-2 w-full sm:flex-1">
                    <i data-lucide="volume-x" class="w-5 h-5"></i>
                    Sem Áudio
                </button>
            </div>
            
        </div>
    </div>

    <!-- Botão Voltar para Biblioteca -->
    <a href="javascript:history.back()" class="fixed top-4 left-4 z-50 bg-white/90 backdrop-blur-sm border border-slate-200 px-4 py-2 rounded-xl shadow-md flex items-center gap-2 hover:bg-slate-50 text-slate-700 transition-all font-medium text-sm tooltip" title="Voltar para a Biblioteca de Mídia">
        <i data-lucide="library" class="w-4 h-4 text-emerald-600"></i>
        <span class="hide-on-mobile">Biblioteca</span>
    </a>

    <!-- ÁREA DE APRESENTAÇÃO DE IMAGENS -->
    <div id="presentation-area" class="relative w-full flex-1 overflow-hidden flex justify-center items-center bg-[#fafbf6]">
        
        <!-- Fundo Geral Permanente (Sempre 100% de opacidade no fundo) -->
        <img id="bg-general" src="geral.png" alt="Visão Geral Feedback" class="absolute inset-0 w-full h-full object-contain opacity-100 z-0">

        <!-- Overlay de Desfoque (Blur) na paleta de cores (fundo claro com blur) -->
        <div id="blur-overlay" class="absolute inset-0 bg-[#fafbf6]/85 backdrop-blur-md opacity-0 transition-opacity duration-1000 z-10 pointer-events-none"></div>

        <!-- Temas (Imagens Individuais) - Todas com o mesmo comportamento (Opacidade 0 e reduzidas no início) -->
        <img id="img-capa" src="capa.png" alt="Capa Feedback" class="absolute max-w-5xl w-11/12 max-h-[85%] object-contain opacity-0 transition-all duration-1000 scale-95 z-20 pointer-events-none">

        <img id="img-receber" src="receber.png" alt="Como Receber e Agir" class="absolute max-w-5xl w-11/12 max-h-[85%] object-contain opacity-0 transition-all duration-1000 scale-95 z-20 pointer-events-none">
        
        <img id="img-sci" src="sci.png" alt="Metodologia SCI" class="absolute max-w-5xl w-11/12 max-h-[85%] object-contain opacity-0 transition-all duration-1000 scale-95 z-20 pointer-events-none">
        
        <img id="img-praticas" src="praticas.png" alt="Boas Práticas" class="absolute max-w-5xl w-11/12 max-h-[85%] object-contain opacity-0 transition-all duration-1000 scale-95 z-20 pointer-events-none">

        <!-- Texto Reflexão (Máquina de Escrever) -->
        <div id="container-reflexao" class="absolute z-30 max-w-4xl w-11/12 text-center opacity-0 transition-opacity duration-1000 pointer-events-none flex flex-col items-center justify-center">
            <i data-lucide="quote" class="w-12 h-12 md:w-16 md:h-16 text-emerald-500 mb-6 opacity-80"></i>
            <p id="texto-reflexao" class="text-2xl md:text-4xl lg:text-5xl font-medium text-slate-800 leading-relaxed tracking-wide min-h-[150px] font-serif"></p>
            <p id="autor-reflexao" class="mt-8 text-emerald-600 font-semibold text-lg md:text-2xl opacity-0 transition-opacity duration-1000">— Sheryl Sandberg</p>
        </div>
    </div>

    <!-- Painel Inferior de Navegação -->
    <div class="h-[80px] bg-white border-t border-slate-200 px-4 md:px-8 w-full flex items-center justify-between shrink-0 shadow-[0_-4px_15px_rgba(0,0,0,0.02)] z-50 relative">
        
        <div class="w-1/4 hidden md:block"></div>

        <!-- Container Central Limitado para Rolagem -->
        <div class="flex-1 flex justify-center items-center gap-1 md:gap-3">
            <button onclick="scrollCarousel(-1)" class="p-1 md:p-2 rounded-full text-slate-400 hover:text-emerald-600 hover:bg-slate-100 transition-colors shrink-0">
                <i data-lucide="chevron-left" class="w-4 h-4 md:w-5 md:h-5"></i>
            </button>

            <!-- Área de Rolagem dos Números -->
            <div class="flex items-center justify-start gap-2 overflow-x-auto no-scrollbar py-2 scroll-smooth w-[260px] md:w-[380px]" id="pagination-container">
                <!-- Injetado via JS -->
            </div>

            <button onclick="scrollCarousel(1)" class="p-1 md:p-2 rounded-full text-slate-400 hover:text-emerald-600 hover:bg-slate-100 transition-colors shrink-0">
                <i data-lucide="chevron-right" class="w-4 h-4 md:w-5 md:h-5"></i>
            </button>
        </div>

        <!-- Reprodutor de Áudio -->
        <div class="flex items-center justify-end w-full md:w-1/4">
            <div class="flex flex-col items-end">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mr-1 mb-0.5">Narração</span>
                <audio id="presentation-audio" src="audio.mp3" controls class="h-8 md:h-10 w-48 md:w-64 outline-none rounded-lg bg-slate-50"></audio>
            </div>
        </div>
    </div>

    <!-- Balão de Tooltip -->
    <div id="global-tooltip" class="fixed z-[110] px-3 py-1.5 bg-slate-800 text-white text-xs md:text-sm whitespace-nowrap rounded-lg shadow-xl pointer-events-none transition-all duration-200 opacity-0 invisible">
        <span id="global-tooltip-text"></span>
        <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
    </div>

    <script>
        lucide.createIcons();

        // Tempos e configurações do fluxo da apresentação
        const steps = [
            { id: 0, title: "1. Capa", time: 0, type: "capa" },
            { id: 1, title: "2. Visão Geral", time: 35, type: "geral" },                // 00:35
            { id: 2, title: "3. Como Receber e Agir", time: 66, type: "receber" },       // 01:06
            { id: 3, title: "4. Visão Geral", time: 160, type: "geral" },                // 02:40
            { id: 4, title: "5. Metodologia SCI", time: 170, type: "sci" },              // 02:50
            { id: 5, title: "6. Visão Geral", time: 205, type: "geral" },                // 03:25
            { id: 6, title: "7. Boas Práticas", time: 217, type: "praticas" },           // 03:37
            { id: 7, title: "8. Visão Geral", time: 300, type: "geral" },                // 05:00
            { id: 8, title: "9. Reflexão", time: 325, type: "texto" },                   // 05:25
            { id: 9, title: "10. Visão Geral Final", time: 333, type: "geral" },         // 05:33
        ];

        let currentStepIndex = -1; // Inicializado como -1 para forçar a renderização da etapa 0 ao carregar a página
        let typingTimeout = null;
        const textoReflexao = "“Não podemos mudar algo que não percebemos, mas depois que percebemos, não podemos deixar de mudar”";

        // Inicia a apresentação (remover overlay)
        function startPresentation(comAudio) {
            const overlay = document.getElementById('start-overlay');
            const audio = document.getElementById('presentation-audio');

            overlay.classList.add('opacity-0');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                
                if (comAudio && audio) {
                    audio.playbackRate = 1.25;
                    audio.play().catch(e => console.log("O navegador bloqueou o autoplay:", e));
                }
            }, 500); 
        }

        function initPagination() {
            const container = document.getElementById('pagination-container');
            container.innerHTML = ''; 
            
            container.insertAdjacentHTML('beforeend', '<div class="shrink-0 w-[130px] md:w-[190px]"></div>');

            steps.forEach((step, index) => {
                container.insertAdjacentHTML('beforeend', `
                    <button onclick="goToStep(${index})" 
                            id="page-btn-${index}" 
                            onmouseenter="handleMouseEnter(${index}, this)"
                            onmouseleave="hideGlobalTooltip()"
                            class="relative flex items-center justify-center rounded-full transition-all duration-300 shrink-0">
                        <span id="page-label-${index}" class="transition-all duration-300 whitespace-nowrap font-medium"></span>
                    </button>
                `);
            });

            container.insertAdjacentHTML('beforeend', '<div class="shrink-0 w-[130px] md:w-[190px]"></div>');
            updateUI(); // Chama a atualização de UI imediatamente
        }

        function updateUI() {
            steps.forEach((step, index) => {
                const btn = document.getElementById(`page-btn-${index}`);
                const label = document.getElementById(`page-label-${index}`);
                const distance = Math.abs(index - currentStepIndex);
                
                if (distance === 0) {
                    btn.className = "flex items-center justify-center rounded-full transition-all duration-500 bg-emerald-600 text-white shadow-md ring-4 ring-emerald-100 shrink-0 h-10 px-4 md:px-5 cursor-default";
                    label.innerText = step.title; 
                    label.className = "whitespace-nowrap font-bold text-sm md:text-base";
                } else if (distance === 1) {
                    btn.className = "flex items-center justify-center rounded-full transition-all duration-500 bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-emerald-600 shrink-0 h-10 w-10 cursor-pointer";
                    label.innerText = index + 1; 
                    label.className = "font-medium text-sm md:text-base";
                } else if (distance === 2) {
                    btn.className = "flex items-center justify-center rounded-full transition-all duration-500 bg-slate-100/80 text-slate-400 hover:bg-slate-200 hover:text-emerald-600 shrink-0 h-8 w-8 cursor-pointer";
                    label.innerText = index + 1; 
                    label.className = "font-medium text-xs";
                } else {
                    btn.className = "flex items-center justify-center rounded-full transition-all duration-500 bg-slate-100/50 text-slate-300 hover:bg-slate-200 hover:text-emerald-600 shrink-0 h-6 w-6 cursor-pointer opacity-70 hover:opacity-100";
                    label.innerText = index + 1; 
                    label.className = "font-medium text-[10px]";
                }
            });

            hideGlobalTooltip();

            const activeBtn = document.getElementById(`page-btn-${currentStepIndex}`);
            if (activeBtn) {
                setTimeout(() => {
                    activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }, 100); 
            }
        }

        function goToStep(index, syncAudio = true) {
            if (index < 0 || index >= steps.length) return;
            if (currentStepIndex === index && !syncAudio) return;

            currentStepIndex = index;
            const step = steps[index];
            updateUI();

            if (syncAudio) {
                const audio = document.getElementById('presentation-audio');
                if (audio) audio.currentTime = step.time;
            }

            // Elementos visuais
            const blurOverlay = document.getElementById('blur-overlay');
            const imgCapa = document.getElementById('img-capa');
            const imgReceber = document.getElementById('img-receber');
            const imgSci = document.getElementById('img-sci');
            const imgPraticas = document.getElementById('img-praticas');
            const containerReflexao = document.getElementById('container-reflexao');
            const pTexto = document.getElementById('texto-reflexao');
            const pAutor = document.getElementById('autor-reflexao');

            // 1. Reseta tudo para estado oculto/invisível
            blurOverlay.classList.replace('opacity-100', 'opacity-0');
            
            [imgCapa, imgReceber, imgSci, imgPraticas].forEach(img => {
                if (img) {
                    img.classList.replace('opacity-100', 'opacity-0');
                    img.classList.replace('scale-100', 'scale-95');
                    img.classList.remove('pointer-events-auto');
                }
            });

            containerReflexao.classList.replace('opacity-100', 'opacity-0');
            pTexto.innerHTML = ''; // Limpa o texto
            pTexto.classList.remove('typing-cursor');
            pAutor.classList.replace('opacity-100', 'opacity-0');
            clearTimeout(typingTimeout); // Interrompe animação de texto se houver

            // 2. Aplica a nova configuração baseada no tipo da etapa
            if (step.type !== 'geral') {
                blurOverlay.classList.replace('opacity-0', 'opacity-100');
            }

            if (step.type === 'capa') {
                imgCapa.classList.replace('opacity-0', 'opacity-100');
                imgCapa.classList.replace('scale-95', 'scale-100');
                imgCapa.classList.add('pointer-events-auto');
            } else if (step.type === 'receber') {
                imgReceber.classList.replace('opacity-0', 'opacity-100');
                imgReceber.classList.replace('scale-95', 'scale-100');
                imgReceber.classList.add('pointer-events-auto');
            } else if (step.type === 'sci') {
                imgSci.classList.replace('opacity-0', 'opacity-100');
                imgSci.classList.replace('scale-95', 'scale-100');
                imgSci.classList.add('pointer-events-auto');
            } else if (step.type === 'praticas') {
                imgPraticas.classList.replace('opacity-0', 'opacity-100');
                imgPraticas.classList.replace('scale-95', 'scale-100');
                imgPraticas.classList.add('pointer-events-auto');
            } else if (step.type === 'texto') {
                containerReflexao.classList.replace('opacity-0', 'opacity-100');
                startTypingEffect(pTexto, pAutor);
            }
        }

        function startTypingEffect(textoElemento, autorElemento) {
            let i = 0;
            textoElemento.innerHTML = '';
            textoElemento.classList.add('typing-cursor');
            
            function typeCharacter() {
                if (i < textoReflexao.length) {
                    textoElemento.innerHTML += textoReflexao.charAt(i);
                    i++;
                    typingTimeout = setTimeout(typeCharacter, 45); // Velocidade de digitação
                } else {
                    textoElemento.classList.remove('typing-cursor');
                    autorElemento.classList.replace('opacity-0', 'opacity-100');
                }
            }
            // Inicia com um pequeno atraso para dar tempo do desfoque aparecer
            typingTimeout = setTimeout(typeCharacter, 800);
        }

        const audioPlayer = document.getElementById('presentation-audio');
        if (audioPlayer) {
            audioPlayer.addEventListener('timeupdate', () => {
                const currentTime = audioPlayer.currentTime;
                let targetStep = 0;

                for (let i = steps.length - 1; i >= 0; i--) {
                    if (currentTime >= steps[i].time) {
                        targetStep = i;
                        break;
                    }
                }

                if (currentStepIndex !== targetStep) {
                    goToStep(targetStep, false); 
                }
            });

            audioPlayer.addEventListener('ended', () => {
                goToStep(0, false);
            });
        }

        function handleMouseEnter(index, element) {
            if (index !== currentStepIndex) {
                const tooltip = document.getElementById('global-tooltip');
                document.getElementById('global-tooltip-text').innerText = steps[index].title;
                const rect = element.getBoundingClientRect();
                tooltip.style.left = (rect.left + rect.width / 2) + 'px';
                tooltip.style.top = (rect.top - 8) + 'px'; 
                tooltip.style.transform = 'translate(-50%, -100%)';
                tooltip.classList.remove('opacity-0', 'invisible');
            }
        }

        function hideGlobalTooltip() {
            const tooltip = document.getElementById('global-tooltip');
            if (tooltip) tooltip.classList.add('opacity-0', 'invisible');
        }

        function scrollCarousel(direction) {
            const container = document.getElementById('pagination-container');
            container.scrollBy({ left: direction * 150, behavior: 'smooth' });
        }

        function nextStep() {
            if (currentStepIndex < steps.length - 1) goToStep(currentStepIndex + 1);
            else goToStep(0);
        }

        function prevStep() {
            if (currentStepIndex > 0) goToStep(currentStepIndex - 1);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextStep();
            if (e.key === 'ArrowLeft') prevStep();
        });

        // INICIALIZAÇÃO IMEDIATA (Não espera imagens, resolve o problema da barra vazia)
        window.onload = () => {
            initPagination();
            goToStep(0, false); 
            
            if (audioPlayer) {
                audioPlayer.playbackRate = 1.25;
            }
        };

    </script>
</body>
</html>
