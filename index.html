<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manual de Feedback - Ciclo de Performance</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #fafbf6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Classe para ocultar a barra de rolagem mas permitir arrastar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (max-width: 640px) {
            .hide-on-mobile { display: none; }
        }

        .typewriter-cursor::after {
            content: '|';
            animation: blink 1s step-start infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Transições suaves para os elementos visuais */
        .visual-element {
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-out, filter 0.8s ease-in-out;
        }
    </style>
</head>
<body class="antialiased text-gray-800 flex flex-col">

    <div id="start-overlay" class="fixed inset-0 z-[100] bg-white/70 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl flex flex-col items-center max-w-lg w-11/12 text-center border border-slate-200 transform transition-transform">
            
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-6 animate-bounce">
                <i data-lucide="play" class="w-10 h-10 ml-1"></i>
            </div>
            
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-3">Guia de Feedback</h1>
            <p class="text-slate-500 mb-8">Bem-vindo(a) ao guia interativo de Feedback. Escolha como deseja iniciar a apresentação.</p>
            
            <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                <button onclick="startPresentation(true)" class="px-6 py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full font-bold text-base transition-transform hover:scale-105 active:scale-95 shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 w-full sm:flex-1">
                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                    Com Áudio
                </button>
                <button onclick="startPresentation(false)" class="px-6 py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-full font-bold text-base transition-transform hover:scale-105 active:scale-95 shadow-sm flex items-center justify-center gap-2 w-full sm:flex-1">
                    <i data-lucide="volume-x" class="w-5 h-5"></i>
                    Sem Áudio
                </button>
            </div>
            
        </div>
    </div>

    <a href="javascript:history.back()" class="fixed top-4 left-4 z-50 bg-white/90 backdrop-blur-sm border border-slate-200 px-4 py-2 rounded-xl shadow-md flex items-center gap-2 hover:bg-slate-50 text-slate-700 transition-all font-medium text-sm tooltip" title="Voltar para a Biblioteca de Mídia">
        <i data-lucide="library" class="w-4 h-4 text-emerald-600"></i>
        <span class="hide-on-mobile">Biblioteca</span>
    </a>

    <div id="presentation-area" class="relative w-full h-[calc(100vh-80px)] overflow-hidden flex justify-center items-center bg-[#fafbf6]">
        
        <!-- Fundo Geral -->
        <img id="bg-general" src="geral.png" alt="Visão Geral Feedback" class="absolute inset-0 w-full h-full object-contain opacity-100 visual-element z-0">

        <!-- Overlay de Desfoque (Blur) -->
        <div id="blur-overlay" class="absolute inset-0 bg-slate-900/50 backdrop-blur-md opacity-0 visual-element z-10 pointer-events-none"></div>

        <!-- Container para as Imagens dos Temas -->
        <img id="theme-image" src="" alt="Tema Atual" class="absolute z-20 max-h-[85%] max-w-[90%] md:max-w-[70%] object-contain rounded-2xl shadow-2xl opacity-0 scale-95 visual-element pointer-events-none">

        <!-- Container para o Texto de Reflexão (Máquina de Escrever) -->
        <div id="text-container" class="absolute z-30 px-6 max-w-4xl text-center flex flex-col items-center justify-center opacity-0 scale-95 visual-element pointer-events-none">
            <p id="typewriter-text" class="text-white font-medium text-2xl md:text-4xl lg:text-5xl leading-tight md:leading-relaxed drop-shadow-lg font-serif italic"></p>
        </div>

    </div>

    <div class="h-[80px] bg-white border-t border-slate-200 px-4 md:px-8 w-full flex items-center justify-between shrink-0 shadow-[0_-4px_15px_rgba(0,0,0,0.02)] z-40 relative">
        
        <div class="w-1/4 hidden md:block"></div>

        <div class="flex-1 flex justify-center items-center gap-1 md:gap-3">
            <button onclick="scrollCarousel(-1)" class="p-1 md:p-2 rounded-full text-slate-400 hover:text-emerald-600 hover:bg-slate-100 transition-colors shrink-0 tooltip" title="Rolar etapas">
                <i data-lucide="chevron-left" class="w-4 h-4 md:w-5 md:h-5"></i>
            </button>

            <div class="flex items-center justify-start gap-2 overflow-x-auto no-scrollbar py-2 scroll-smooth w-[260px] md:w-[380px]" id="pagination-container">
                <!-- Botões gerados via JS -->
            </div>

            <button onclick="scrollCarousel(1)" class="p-1 md:p-2 rounded-full text-slate-400 hover:text-emerald-600 hover:bg-slate-100 transition-colors shrink-0 tooltip" title="Rolar etapas">
                <i data-lucide="chevron-right" class="w-4 h-4 md:w-5 md:h-5"></i>
            </button>
        </div>

        <div class="flex items-center justify-end w-full md:w-1/4">
            <div class="flex flex-col items-end">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mr-1 mb-0.5">Narração</span>
                <!-- Alterado src para audio.mp3 -->
                <audio id="presentation-audio" src="audio.mp3" controls class="h-8 md:h-10 w-48 md:w-64 outline-none rounded-lg bg-slate-50"></audio>
            </div>
        </div>
    </div>

    <!-- HTML DO BALÃO FLUTUANTE -->
    <div id="global-tooltip" class="fixed z-50 px-3 py-1.5 bg-slate-800 text-white text-xs md:text-sm whitespace-nowrap rounded-lg shadow-xl pointer-events-none transition-all duration-200 opacity-0 invisible">
        <span id="global-tooltip-text"></span>
        <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
    </div>

    <script>
        lucide.createIcons();

        // Dados de todas as etapas (tempos, tipos de visualização e arquivos correspondentes)
        const steps = [
            { id: 0, title: "1. Introdução", time: 0, type: "geral", file: "geral.png" },
            { id: 1, title: "2. Como Receber e Agir?", time: 66, type: "tema", file: "receber.png" }, // 01:06
            { id: 2, title: "3. Retorno ao Mapa", time: 160, type: "geral", file: "geral.png" },       // 02:40
            { id: 3, title: "4. Metodologia SCI", time: 170, type: "tema", file: "sci.png" },         // 02:50
            { id: 4, title: "5. Retorno ao Mapa", time: 205, type: "geral", file: "geral.png" },       // 03:25
            { id: 5, title: "6. Boas Práticas", time: 217, type: "tema", file: "praticas.png" },      // 03:37
            { id: 6, title: "7. Retorno ao Mapa", time: 300, type: "geral", file: "geral.png" },       // 05:00
            { id: 7, title: "8. Reflexão Final", time: 325, type: "texto", file: null },             // 05:25
            { id: 8, title: "9. Conclusão", time: 333, type: "geral", file: "geral.png" }             // 05:33
        ];

        let currentStepIndex = 0;
        let typeWriterInterval = null;
        let isTyping = false;

        const quoteText = "“Não podemos mudar algo que não percebemos, mas depois que percebemos, não podemos deixar de mudar”.\n\n— Sheryl Sandberg";

        function startPresentation(comAudio) {
            const overlay = document.getElementById('start-overlay');
            const audio = document.getElementById('presentation-audio');

            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
                if (comAudio && audio) {
                    audio.playbackRate = 1.25; 
                    audio.play().catch(e => console.log("O navegador bloqueou o autoplay:", e));
                }
            }, 500); 
        }

        function initPagination() {
            const container = document.getElementById('pagination-container');
            container.innerHTML = ''; 
            
            container.insertAdjacentHTML('beforeend', '<div class="shrink-0 w-[130px] md:w-[190px]"></div>');

            steps.forEach((step, index) => {
                container.insertAdjacentHTML('beforeend', `
                    <button onclick="goToStep(${index})" 
                            id="page-btn-${index}" 
                            onmouseenter="handleMouseEnter(${index}, this)"
                            onmouseleave="hideGlobalTooltip()"
                            class="relative flex items-center justify-center rounded-full transition-all duration-300 shrink-0">
                        <span id="page-label-${index}" class="transition-all duration-300 whitespace-nowrap font-medium"></span>
                    </button>
                `);
            });

            container.insertAdjacentHTML('beforeend', '<div class="shrink-0 w-[130px] md:w-[190px]"></div>');
        }

        function updateUI() {
            steps.forEach((step, index) => {
                const btn = document.getElementById(`page-btn-${index}`);
                const label = document.getElementById(`page-label-${index}`);
                const distance = Math.abs(index - currentStepIndex);
                
                if (distance === 0) {
                    btn.className = "flex items-center justify-center rounded-full transition-all duration-500 bg-emerald-600 text-white shadow-md ring-4 ring-emerald-100 shrink-0 h-10 px-4 md:px-5 cursor-default";
                    label.innerText = step.title; 
                    label.className = "whitespace-nowrap font-bold text-sm md:text-base";
                } else if (distance === 1) {
                    btn.className = "flex items-center justify-center rounded-full transition-all duration-500 bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-emerald-600 shrink-0 h-10 w-10 cursor-pointer";
                    label.innerText = index + 1; 
                    label.className = "font-medium text-sm md:text-base";
                } else if (distance === 2) {
                    btn.className = "flex items-center justify-center rounded-full transition-all duration-500 bg-slate-100/80 text-slate-400 hover:bg-slate-200 hover:text-emerald-600 shrink-0 h-8 w-8 cursor-pointer";
                    label.innerText = index + 1; 
                    label.className = "font-medium text-xs";
                } else {
                    btn.className = "flex items-center justify-center rounded-full transition-all duration-500 bg-slate-100/50 text-slate-300 hover:bg-slate-200 hover:text-emerald-600 shrink-0 h-6 w-6 cursor-pointer opacity-70 hover:opacity-100";
                    label.innerText = index + 1; 
                    label.className = "font-medium text-[10px]";
                }
            });

            hideGlobalTooltip();

            const activeBtn = document.getElementById(`page-btn-${currentStepIndex}`);
            if (activeBtn) {
                setTimeout(() => {
                    activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }, 100);
            }
        }

        function applyVisualState(step) {
            const bgGeneral = document.getElementById('bg-general');
            const blurOverlay = document.getElementById('blur-overlay');
            const themeImage = document.getElementById('theme-image');
            const textContainer = document.getElementById('text-container');
            const typewriterText = document.getElementById('typewriter-text');

            // Cancela animação de texto se estiver ocorrendo
            clearInterval(typeWriterInterval);
            isTyping = false;

            if (step.type === 'geral') {
                // Remove desfoque, oculta tema e textos
                blurOverlay.classList.replace('opacity-100', 'opacity-0');
                themeImage.classList.replace('opacity-100', 'opacity-0');
                themeImage.classList.replace('scale-100', 'scale-95');
                textContainer.classList.replace('opacity-100', 'opacity-0');
                textContainer.classList.replace('scale-100', 'scale-95');
                typewriterText.innerHTML = '';
            } 
            else if (step.type === 'tema') {
                // Aplica desfoque no fundo e mostra a imagem do tema
                blurOverlay.classList.replace('opacity-0', 'opacity-100');
                
                // Transição suave da troca de imagem se já estiver visível
                themeImage.classList.replace('opacity-100', 'opacity-0');
                themeImage.classList.replace('scale-100', 'scale-95');
                
                setTimeout(() => {
                    themeImage.src = step.file;
                    themeImage.classList.replace('opacity-0', 'opacity-100');
                    themeImage.classList.replace('scale-95', 'scale-100');
                }, 300);

                textContainer.classList.replace('opacity-100', 'opacity-0');
                textContainer.classList.replace('scale-100', 'scale-95');
                typewriterText.innerHTML = '';
            }
            else if (step.type === 'texto') {
                // Aplica desfoque e inicia texto de reflexão
                blurOverlay.classList.replace('opacity-0', 'opacity-100');
                themeImage.classList.replace('opacity-100', 'opacity-0');
                themeImage.classList.replace('scale-100', 'scale-95');
                
                textContainer.classList.replace('opacity-0', 'opacity-100');
                textContainer.classList.replace('scale-95', 'scale-100');
                
                startTypewriterEffect();
            }
        }

        function startTypewriterEffect() {
            const element = document.getElementById('typewriter-text');
            element.innerHTML = '';
            element.classList.add('typewriter-cursor');
            let i = 0;
            isTyping = true;
            
            // Corrige quebras de linha para HTML
            const textToType = quoteText.replace(/\n/g, '<br/>');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = textToType;
            const plainNodes = Array.from(tempDiv.childNodes);
            let charIndex = 0;
            let currentStr = "";

            typeWriterInterval = setInterval(() => {
                if (charIndex < textToType.length) {
                    let char = textToType.charAt(charIndex);
                    if (char === '<') {
                        // Avança até fechar a tag (ex: <br/>)
                        let tag = "";
                        while (textToType.charAt(charIndex) !== '>' && charIndex < textToType.length) {
                            tag += textToType.charAt(charIndex);
                            charIndex++;
                        }
                        tag += '>';
                        currentStr += tag;
                    } else {
                        currentStr += char;
                    }
                    element.innerHTML = currentStr;
                    charIndex++;
                } else {
                    clearInterval(typeWriterInterval);
                    isTyping = false;
                    element.classList.remove('typewriter-cursor');
                }
            }, 45); // Velocidade de digitação
        }

        function goToStep(index, syncAudio = true) {
            if (index < 0 || index >= steps.length) return;
            if (currentStepIndex === index && !syncAudio) return;

            currentStepIndex = index;
            const step = steps[index];
            
            applyVisualState(step);
            updateUI();

            const audio = document.getElementById('presentation-audio');
            if (syncAudio && audio) {
                audio.currentTime = step.time;
            }
        }

        const audioPlayer = document.getElementById('presentation-audio');
        if (audioPlayer) {
            audioPlayer.addEventListener('timeupdate', () => {
                const currentTime = audioPlayer.currentTime;
                let targetStep = 0;

                for (let i = steps.length - 1; i >= 0; i--) {
                    if (currentTime >= steps[i].time) {
                        targetStep = i;
                        break;
                    }
                }

                if (currentStepIndex !== targetStep) {
                    goToStep(targetStep, false); 
                }
            });

            audioPlayer.addEventListener('ended', () => {
                goToStep(0, false);
            });
        }

        function handleMouseEnter(index, element) {
            if (index !== currentStepIndex) {
                const tooltip = document.getElementById('global-tooltip');
                document.getElementById('global-tooltip-text').innerText = steps[index].title;
                const rect = element.getBoundingClientRect();
                
                tooltip.style.left = (rect.left + rect.width / 2) + 'px';
                tooltip.style.top = (rect.top - 8) + 'px'; 
                tooltip.style.transform = 'translate(-50%, -100%)';
                tooltip.classList.remove('opacity-0', 'invisible');
            }
        }

        function hideGlobalTooltip() {
            const tooltip = document.getElementById('global-tooltip');
            if (tooltip) tooltip.classList.add('opacity-0', 'invisible');
        }

        function scrollCarousel(direction) {
            const container = document.getElementById('pagination-container');
            container.scrollBy({ left: direction * 150, behavior: 'smooth' });
        }

        function nextStep() {
            if (currentStepIndex < steps.length - 1) goToStep(currentStepIndex + 1);
            else goToStep(0);
        }

        function prevStep() {
            if (currentStepIndex > 0) goToStep(currentStepIndex - 1);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') nextStep();
            if (e.key === 'ArrowLeft') prevStep();
        });

        window.onload = () => {
            initPagination();
            const audio = document.getElementById('presentation-audio');
            if (audio) audio.playbackRate = 1.25;
            
            // Inicia na etapa 0
            goToStep(0, false);
        };
    </script>
</body>
</html>
